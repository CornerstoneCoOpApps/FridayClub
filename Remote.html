<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HostOS</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
--bg-base: #2a0202; --bg-grad-top: #4a0404; --bg-grad-bot: #1a0101;
--accent-gold: #ffd700; --accent-dark-gold: #b8860b;
--panel-bg: #111111; --btn-bg: #1e1e1e; --btn-active: #333333;
--text-light: #f5f5f5; --danger: #ff5252; --success: #4caf50; --nav-bg: #0a0a0a;
}

body, html { margin: 0; padding: 0; background: linear-gradient(135deg, var(--bg-grad-top), var(--bg-grad-bot)); color: var(--text-light); font-family: 'Oswald', sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; display: flex; flex-direction: column; height: 100%; overflow: hidden; touch-action: pan-y; }

/* --- 🔐 PIN LOCK SCREEN --- */
#pin-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at top, var(--bg-grad-top), var(--bg-grad-bot)); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.logo-box { text-align: center; margin-bottom: 20px; }
.logo-box h1 { font-size: 2.8em; color: var(--accent-gold); margin: 0; line-height: 1.1; text-shadow: 0 4px 10px rgba(0,0,0,0.8); letter-spacing: 2px; }
.pin-display { font-size: 3em; letter-spacing: 15px; margin-bottom: 30px; color: var(--accent-gold); height: 60px; text-shadow: 0 0 15px var(--accent-dark-gold); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 85%; max-width: 350px; }
.key-btn { background: var(--panel-bg); border: 2px solid #333; color: var(--text-light); font-size: 2em; padding: 20px 0; border-radius: 12px; font-family: 'Oswald'; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: all 0.1s; }
.key-btn:active { background: var(--btn-active); border-color: var(--accent-gold); transform: scale(0.95); }

/* --- 🎛️ HOST DASHBOARD --- */
#dashboard { display: none; flex-direction: column; height: 100%; }
.header { background: var(--panel-bg); padding: env(safe-area-inset-top, 15px) 15px 15px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-gold); color: var(--accent-gold); letter-spacing: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); z-index: 10; font-weight: bold; }
.host-badge { background: #333; padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; color: var(--accent-gold); display: flex; align-items: center; gap: 5px; }

.view-container { flex: 1; overflow-y: auto; padding: 20px 15px; position: relative; }
.tab-view { display: none; animation: fadeIn 0.2s ease-in-out; }
.tab-view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

.btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.remote-btn { background: var(--btn-bg); border: 2px solid #333; color: var(--text-light); padding: 25px 10px; border-radius: 12px; font-family: 'Oswald', sans-serif; font-size: 1.1em; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.5); transition: transform 0.05s, border-color 0.15s; }
.remote-btn:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(0,0,0,0.8); }
.remote-btn svg { width: 40px; height: 40px; stroke-width: 1.5; stroke: currentColor; fill: none; transition: stroke 0.2s; }

.btn-sound:active { border-color: #00f2fe; } .btn-sound:active svg { stroke: #00f2fe; }
.btn-stage { border-color: var(--accent-dark-gold); color: var(--accent-gold); } .btn-stage:active { background: var(--accent-gold); color: #000; }
.btn-danger { border-color: #8a0e0e; color: var(--danger); } .btn-danger:active { background: var(--danger); color: #fff; }

.section-title { color: #888; font-size: 1.1em; margin: 15px 0 10px 0; border-bottom: 1px dashed #333; padding-bottom: 5px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center;}

/* --- 📱 BOTTOM NAVIGATION --- */
.bottom-nav { display: flex; background: var(--nav-bg); border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom, 15px); z-index:50;}
.nav-item { flex: 1; padding: 15px 0; text-align: center; color: #777; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: color 0.2s; }
.nav-item svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; }
.nav-item.active { color: var(--accent-gold); }

/* --- OVERLAYS & MODALS --- */
.full-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 10000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px); }
.overlay-card { background: linear-gradient(135deg, #18002b, #090014); border: 2px solid #00f2fe; border-radius: 16px; width: 100%; max-width: 400px; padding: 25px; box-shadow: 0 15px 40px rgba(0,242,254,0.3); text-align: center; max-height: 90vh; overflow-y: auto; }

.adaptive-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
.adaptive-btn { padding: 15px 0; border: none; border-radius: 8px; font-family: 'Oswald'; font-size: 1.2em; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: transform 0.1s; }
.adaptive-btn:active { transform: translateY(2px); box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

.winner-row { background: #111; border: 1px solid #333; padding: 12px; margin-bottom: 8px; border-radius: 8px; text-align: left; cursor: pointer; transition: border-color 0.2s; }
.winner-row:active { border-color: var(--accent-gold); background: #222; }

#box-stage-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-base); z-index: 9000; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.box-header { background: #111; padding: 15px; text-align: center; font-size: 1.5em; border-bottom: 2px solid var(--accent-gold); color: var(--accent-gold); letter-spacing: 2px; font-weight: bold; }

#toast { position: fixed; top: env(safe-area-inset-top, 20px); left: 50%; transform: translateX(-50%); background: var(--accent-gold); color: #000; padding: 12px 25px; border-radius: 30px; font-size: 1.1em; font-weight: bold; transition: opacity 0.3s, top 0.3s; z-index: 20000; white-space: nowrap; opacity: 0; pointer-events: none; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
#toast.show { opacity: 1; top: calc(env(safe-area-inset-top, 20px) + 20px); }

.game-theme-card { background: linear-gradient(135deg, #d32f2f, #b71c1c); border: 4px solid var(--accent-gold); box-shadow: 0 15px 40px rgba(0,0,0,0.9); }
.game-theme-input { width: 100%; padding: 15px; font-size: 1.4em; font-family: 'Oswald'; background: #fff; border: 3px solid #000; color: #000; font-weight: bold; border-radius: 8px; margin-bottom: 12px; box-sizing: border-box; text-align: center; }
.game-theme-input::placeholder { color: #888; font-weight: normal; }

/* 🔥 AUDIO UPLOAD CUSTOM STYLES */
.icon-radio { display: none; }
.icon-label { font-size: 2em; padding: 8px; cursor: pointer; border-radius: 8px; border: 2px solid transparent; transition: all 0.2s; background: #222; }
.icon-radio:checked + .icon-label { border-color: #00f2fe; background: rgba(0, 242, 254, 0.2); transform: scale(1.1); box-shadow: 0 0 10px rgba(0,242,254,0.5); }
.file-upload-input { width: 100%; background: #111; color: #fff; padding: 15px; border-radius: 8px; font-family: 'Oswald'; margin-bottom: 15px; border: 2px dashed #00f2fe; outline: none; }

/* Mini Soundbar Scrollbar Hiding */
#mini-sound-bar::-webkit-scrollbar { display: none; }
#mini-sound-bar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>

<script>
const FB_BASE_URL = "https://friday-club-ticker-default-rtdb.europe-west1.firebasedatabase.app/";
const APP_SCRIPT_URL = "https://script.google.com/a/gateinnwinsford.com/macros/s/AKfycbwX84Y6p9mRo2SUeUOrBaiFjqaI_yQ26K2kE5wO0bofcEYUlOXEnZF7q_RZTYu0Yynb/exec";

let currentPin = "";
let validPin = ""; 
let hostName = ""; 
let sessionToken = null; 

let gridHtml = '';
for(let i=1; i<=15; i++) {
    gridHtml += `<button onclick="selectRemoteBox(${i})" style="background:#1a1a1a; border:2px solid #333; color:#fff; font-family:'Oswald'; font-size:1.4em; padding:15px 0; border-radius:8px; cursor:pointer;" id="r-btn-${i}">${i}</button>`;
}
document.getElementById('box-buttons-grid').innerHTML = gridHtml;

function typePin(val) {
if(val === 'C') currentPin = ""; else if (currentPin.length < 4) currentPin += val;
document.getElementById('pin-dots').innerText = '*'.repeat(currentPin.length);
}

function checkPin() {
if (currentPin.length === 0) return;
document.getElementById('pin-dots').style.letterSpacing = "2px";

let script = document.createElement('script');
script.src = APP_SCRIPT_URL + "?action=verifyPin&pin=" + currentPin + "&callback=pinCallback";
document.body.appendChild(script);
}

function pinCallback(response) {
document.getElementById('pin-dots').style.letterSpacing = "15px"; 

if (response.success && response.payload) {
    validPin = currentPin; 
    hostName = response.name;
    sessionToken = response.token;
    
    // Store token and pin in session storage for instant auto-login
    sessionStorage.setItem('sessionToken', sessionToken);
    sessionStorage.setItem('hostPin', validPin);
    
    document.getElementById('view-container').innerHTML = response.payload;

    document.getElementById('pin-gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    document.getElementById('host-name-badge').innerHTML = `👤 ${hostName.toUpperCase()}`;

    let vaultGrid = document.getElementById('admin-vault-grid');

function instantFirebaseWrite(path, method, payload) {
    if (!sessionToken) sessionToken = sessionStorage.getItem('sessionToken');
    
    if (!sessionToken) {
        showToast("⚠️ VIP Token Lost - Reloading...", false);
        setTimeout(() => location.reload(), 1500);
        return Promise.reject("No Token");
    }
    
    let url = FB_BASE_URL + path + (path.includes(".json") ? "" : ".json") + "?auth=" + sessionToken;
    let options = { 
        method: method,
        headers: { 'Content-Type': 'application/json' }
    };
    if (payload !== undefined) {
        options.body = JSON.stringify(payload);
    }
    
    return fetch(url, options);
}

function fireCommand(category, action, extraPayload = {}) {

Object.assign(cmdPayload, extraPayload);

instantFirebaseWrite("remoteCommand", 'PUT', cmdPayload)
.catch(() => showToast("ERROR SENDING COMMAND"));
}

function submitCorrection(type) {
let row = document.getElementById('ca-row').value; let cid = document.getElementById('ca-cid').value;
let oldCredit = document.getElementById('ca-oldcredit').value; let newAmt = document.getElementById('ca-newamt').value;

if (type !== 'VOID' && (!newAmt || newAmt <= 0)) { alert("Enter a new amount!"); return; }
if (navigator.vibrate) navigator.vibrate([50, 50]);

let actionString = `applyCorrection|${row}|${cid}|${oldCredit}|${type}|${newAmt}`;
fetch(APP_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({
        action: 'secureFirebaseWrite', 
        pin: validPin,
        path: 'remoteCommand.json',
        method: 'PUT',
        payload: { type: 'admin', action: actionString, pin: validPin, timestamp: Date.now() }
    })
});
document.getElementById('correction-action-modal').style.display = 'none'; showToast("CORRECTION APPLIED");
}

let lastSeenWinner = null;
function startRemoteSync() {
    if (!sessionToken) sessionToken = sessionStorage.getItem('sessionToken');
    
    setInterval(() => {
        Promise.all([
            fetch(FB_BASE_URL + "boxes.json").then(r => r.json()).catch(() => null),
            fetch(FB_BASE_URL + "admin.json").then(r => r.json()).catch(() => null),
            fetch(FB_BASE_URL + "customAudioMeta.json").then(r => r.json()).catch(() => null)
        ]).then(([boxesData, adminData, customAudioMeta]) => {
            let cloud = { boxes: boxesData || null, admin: adminData || null, customAudio: customAudioMeta || null };

            if (cloud.boxes && cloud.boxes.prefilled) {
                prefilledCache = cloud.boxes.prefilled;
                for(let i=1; i<=15; i++) {
                    let textEl = document.getElementById(`admin-v-${i}`);
                    let soundEl = document.getElementById(`admin-s-${i}`);
                    if (textEl && document.activeElement !== textEl && document.activeElement !== soundEl) {
                        let val = prefilledCache[i];
                        if (typeof val === 'object') {
                            textEl.value = val.text || "";
                            if (soundEl) soundEl.value = val.sound || "DEFAULT";
                        } else {
                            textEl.value = val || "";
                            if (soundEl) soundEl.value = "DEFAULT";
                        }
                    }
                }
            }

            if (cloud.admin && cloud.admin.winners && document.getElementById('correction-modal').style.display === 'flex') {
                let html = "";
                let winnersArray = Array.isArray(cloud.admin.winners) ? cloud.admin.winners : Object.values(cloud.admin.winners);
                winnersArray.forEach(w => {
                    if (!w || !w.name) return;
                    html += `<div class="winner-row" onclick="loadCorrectionAction('${w.row}', '${w.name.replace(/'/g,"\\'")}', '${w.desc.replace(/'/g,"\\'")}', '${w.id}', '${w.credit}')">
                           <div style="font-size:1.1em; color:#fff;">${w.name}</div>
                           <div style="font-size:0.9em; color:var(--accent-gold);">${w.desc}</div>
                        </div>`;
                });
                if (html === "") html = "<div style='color:#aaa;'>No prizes logged today.</div>";
                document.getElementById('correction-list').innerHTML = html;
                instantFirebaseWrite("admin/winners", 'DELETE');
            }

            let soundGrid = document.getElementById('custom-sounds-grid');
            let miniBar = document.getElementById('mini-sound-bar');
            
            let miniSoundHtml = `
                <button class="remote-btn" onclick="fireCommand('sound', 'drumroll')" style="background:#222; color:#fff; border:1px solid #555; padding:8px 15px; border-radius:20px; font-family:'Oswald'; font-size: 1rem; flex-direction: row; flex: 0 0 auto;">🥁 Drum</button>
                <button class="remote-btn" onclick="fireCommand('sound', 'celebrate')" style="background:#222; color:#fff; border:1px solid #555; padding:8px 15px; border-radius:20px; font-family:'Oswald'; font-size: 1rem; flex-direction: row; flex: 0 0 auto;">🎉 Win</button>
                <button class="remote-btn" onclick="fireCommand('sound', 'sad')" style="background:#222; color:#fff; border:1px solid #555; padding:8px 15px; border-radius:20px; font-family:'Oswald'; font-size: 1rem; flex-direction: row; flex: 0 0 auto;">🚨 Wah</button>
                <button class="remote-btn" onclick="fireCommand('sound', 'whistle')" style="background:#222; color:#fff; border:1px solid #555; padding:8px 15px; border-radius:20px; font-family:'Oswald'; font-size: 1rem; flex-direction: row; flex: 0 0 auto;">🔔 Bell</button>
            `;

            if (cloud.customAudio) {
                let customHtml = "";
                Object.keys(cloud.customAudio).forEach(key => {
                    let sound = cloud.customAudio[key];
                    if (sound && sound.name) {
                        customHtml += `
                        <div style="display:flex; gap:8px; margin-bottom:12px;">
                            <button class="remote-btn btn-sound" onclick="fireCommand('sound', '${key}')" style="flex:1; border-color:#00f2fe; color:#00f2fe; padding:15px;">
                                <div style="font-size:2.2em; margin-bottom:5px;">${sound.icon || '🎵'}</div>
                                <span>${sound.name}</span>
                            </button>
                            <button onclick="deleteCustomSound('${key}')" style="background:var(--danger); color:#fff; border:2px solid #8a0e0e; border-radius:12px; padding:0 20px; font-size:1.5em; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">🗑️</button>
                        </div>`;
                        
                        miniSoundHtml += `<button class="remote-btn" onclick="fireCommand('sound', '${key}')" style="background:#00f2fe; color:#000; border:1px solid #00f2fe; padding:8px 15px; border-radius:20px; font-family:'Oswald'; font-size: 1rem; flex-direction: row; font-weight:bold; flex: 0 0 auto;">${sound.icon || '🎵'} ${sound.name}</button>`;
                        
                        for(let i=1; i<=15; i++) {
                            let sel = document.getElementById(`admin-s-${i}`);
                            if(sel && !sel.querySelector(`option[value="${key}"]`)) {
                                let opt = document.createElement('option');
                                opt.value = key; opt.innerText = `${sound.icon || '🎵'} ${sound.name}`;
                                sel.appendChild(opt);
                            }
                        }
                    }
                });
                if (soundGrid) soundGrid.innerHTML = customHtml;
            } else {
                if (soundGrid) soundGrid.innerHTML = "<div style='grid-column: span 2; color:#555; text-align:center; font-style:italic; padding:15px;'>No custom clips uploaded yet.</div>";
            }
            if (document.getElementById('mini-sound-bar')) document.getElementById('mini-sound-bar').innerHTML = miniSoundHtml;

            let currentWinner = cloud.boxes ? cloud.boxes.activeWinner : null;
            if (currentWinner && currentWinner !== lastSeenWinner) {
                lastSeenWinner = currentWinner;
                document.getElementById('aw-name').innerText = currentWinner;
                
                // 🔥 NEW UI SETUP
                document.getElementById('master-prize-input').value = "";
                selectPrizeType('CASH');

                document.getElementById('adaptive-winner-overlay').style.display = 'flex';
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]); 
            } 
            else if (!currentWinner && lastSeenWinner) {
                lastSeenWinner = null;
                document.getElementById('adaptive-winner-overlay').style.display = 'none';
            }
        }).catch(e => console.log("Sync error...", e));
    }, 500); 
}

    if(navigator.vibrate) navigator.vibrate(20);

function confirmAndSendPrize() {
    let val = document.getElementById('master-prize-input').value.trim();
    if (!val) { alert("Please enter a prize amount or description!"); return; }
    
    let name = document.getElementById('aw-name').innerText;
    let displayStr = "";
    if (currentPrizeType === 'CASH') displayStr = `£${val} Cash`;
    else if (currentPrizeType === 'PINT') displayStr = `${val} Pint(s)`;
    else displayStr = `${val}`;

    if(confirm(`Send ${displayStr} to ${name}?`)) {
        if (navigator.vibrate) navigator.vibrate(50);
        
        // 🔥 Re-adding the Toast Notification for peace of mind!
        showToast("🚀 " + displayStr.toUpperCase() + " LOGGED!");

        fireCommand('wheel', 'award', { 
            prizeType: currentPrizeType === 'CASH' ? 'MEMBERS_CASH' : currentPrizeType, 
            cash: currentPrizeType === 'CASH' ? val : "", 
            pint: currentPrizeType === 'PINT' ? val : "", 
            custom: currentPrizeType === 'CUSTOM' ? val : "" 
        });
        document.getElementById('adaptive-winner-overlay').style.display = 'none';
    }
}

function submitAudioUpload() {
    const nameInput = document.getElementById('upload-sound-name').value.trim();
    const iconInput = document.querySelector('input[name="upload-icon"]:checked').value;
    const fileInput = document.getElementById('upload-sound-file').files[0];
    
    if (!nameInput) { alert("Please enter a name for the clip."); return; }
    if (!fileInput) { alert("Please select an audio file."); return; }
    
    if (fileInput.size > 5 * 1024 * 1024) { alert("File too large! Must be under 5MB."); return; }
    
    document.getElementById('audio-upload-modal').style.display = 'none';
    showToast("UPLOADING... Please wait.");
    
    const reader = new FileReader();
    reader.onload = function(e) {
        const base64Str = e.target.result;
        const uniqueId = "custom_" + Date.now();
        
        const payloadMeta = { name: nameInput, icon: iconInput };
        const payloadData = { data: base64Str };
        
        Promise.all([
            instantFirebaseWrite("customAudioMeta/" + uniqueId, 'PUT', payloadMeta),
            instantFirebaseWrite("customAudioData/" + uniqueId, 'PUT', payloadData)
        ])
        .then(() => {
            showToast("✅ UPLOAD COMPLETE!");
            fireCommand('stage', 'refreshAudio'); 
        }).catch(() => showToast("UPLOAD FAILED"));
    };
    reader.readAsDataURL(fileInput);
    
    document.getElementById('upload-sound-name').value = "";
    document.getElementById('upload-sound-file').value = "";
}

function deleteCustomSound(key) {
    if(confirm("Delete this custom sound?")) {
        Promise.all([
            instantFirebaseWrite("customAudioMeta/" + key, 'DELETE'),
            instantFirebaseWrite("customAudioData/" + key, 'DELETE')
        ]).then(() => {
            showToast("SOUND DELETED");
            fireCommand('stage', 'refreshAudio');
        });
    }
}
