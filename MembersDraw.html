<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Members Draw</title>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=New+Amsterdam&family=Jersey+15&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
      body { background-color: #4a0000; background-image: radial-gradient(#ff9900 15%, transparent 16%), radial-gradient(#ff9900 15%, transparent 16%); background-size: 30px 30px, 15px 15px; background-position: 0 0, 15px 15px; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
      
      /* 🔥 VIBRANT ARCADE TV INTRO GATE */
      #tv-intro-gate { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #4a0000; background-image: radial-gradient(#ff9900 15%, transparent 16%), radial-gradient(#ff9900 15%, transparent 16%); background-size: 30px 30px, 15px 15px; background-position: 0 0, 15px 15px; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1s cubic-bezier(0.25, 1, 0.5, 1), transform 1s cubic-bezier(0.25, 1, 0.5, 1); }

      #tv-intro-gate.unlocked { opacity: 0; transform: scale(1.15); pointer-events: none; }
      .gate-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
      .gate-title { font-family: 'Bowlby One SC', cursive; font-size: 7vw; color: #ffd700; margin: 0 0 30px 0; text-transform: uppercase; line-height: 1; text-shadow: 4px 4px 0px #cc0000, 8px 8px 0px #000, 0 0 30px rgba(255,215,0,0.5); text-align: center; animation: titleFloat 3s ease-in-out infinite alternate; }

      .gate-input-box { background: rgba(0,0,0,0.85); padding: 40px 60px; border-radius: 25px; border: 6px solid #ffcc00; box-shadow: 0 0 50px rgba(255, 204, 0, 0.4), inset 0 0 30px #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 25px; }
      .gate-input { width: 280px; text-align: center; font-size: 4em; font-family: 'Bowlby One SC', cursive; padding: 10px; border-radius: 15px; border: 4px dashed #ff3300; background: #111; color: #33ff00; letter-spacing: 20px; outline: none; margin: 0 auto; text-shadow: 0 0 15px #33ff00; transition: all 0.2s; }
      .gate-input::placeholder { color: #222; text-shadow: none; }
      .gate-input:focus { border-color: #33ff00; box-shadow: 0 0 30px rgba(51, 255, 0, 0.5); background: #0a0a0a; }
      .gate-btn { font-family: 'Bowlby One SC', cursive; font-size: 2.2em; padding: 15px 40px; background: #00cc00; color: #fff; border: 4px solid #005500; border-radius: 50px; cursor: pointer; text-transform: uppercase; transition: transform 0.1s; box-shadow: 0 8px #006600, 0 15px 20px rgba(0,0,0,0.6); width: 100%; text-shadow: 2px 2px 0 #000; margin-top: 10px; }

      .gate-btn.denied { background: #ff0000; border-color: #880000; box-shadow: 0 8px #880000, 0 15px 20px rgba(0,0,0,0.6); }

      #scaler { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; transition: transform 0.3s ease; }

      .game-selector { position: fixed; top: 15px; right: 20px; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); border-radius: 30px; padding: 5px; display: flex; gap: 5px; border: 1px solid rgba(255,255,255,0.2); z-index: 30000; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

      .game-link:hover { color: #fff; background: rgba(255,255,255,0.1); }

      .draw-mode-wrapper { position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); border-radius: 15px; padding: 4px; display: flex; gap: 2px; border: 2px solid #ffd700; z-index: 3000; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
      .mode-btn { background: transparent; color: #aaa; font-family: 'Oswald', sans-serif; font-size: 0.85em; letter-spacing: 1px; padding: 5px 15px; border-radius: 12px; border: none; transition: all 0.2s; text-transform: uppercase; cursor: pointer; }
      .mode-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
      .mode-btn.active { background: #ff5252; color: #fff; font-weight: bold; box-shadow: 0 0 10px rgba(255, 82, 82, 0.6); }
      
      #rollover-box { position: fixed; top: 15px; left: 20px; background: linear-gradient(to bottom, #d32f2f, #b71c1c); border: 3px solid #ffd700; border-radius: 12px; padding: 10px 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.6); z-index: 30000; }
      .rollover-title { font-family: 'Oswald', sans-serif; color: #ffccbc; font-size: 1em; letter-spacing: 1px; margin-bottom: 5px; }
      .rollover-amount { font-family: 'Bowlby One SC', cursive; color: #fff; font-size: 2.2em; text-shadow: 2px 2px 0 #000; margin-bottom: 5px; line-height: 1; }
      .rollover-controls { display: flex; gap: 5px; justify-content: center; }
      .rollover-controls button { font-family: 'Oswald'; font-size: 1.2em; padding: 2px 10px; border-radius: 5px; background: #ffd700; color: #000; border: none; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.5); min-width: 35px; }
      .rollover-controls button:active { transform: translateY(2px); box-shadow: none; }

      #game-container { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(5, 1fr); gap: 10px; width: 95vw; max-width: 1000px; aspect-ratio: 4/3; background: #220000; padding: 15px; border-radius: 20px; box-shadow: 0 0 50px #000; border: 10px solid #cc0000; transition: transform 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 1s ease-out; }
      body.intro-mode #game-container { transform: scale(0.1) translateY(500px); opacity: 0; }
      #center-stage { grid-column: 2 / span 4; grid-row: 2 / span 3; background: linear-gradient(135deg, #ff0000 0%, #990000 100%); border: 8px solid #ffcc00; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: inset 0 0 50px #330000; z-index: 1; overflow: hidden; position: relative; }
      #normal-stage-content { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; transition: opacity 0.3s; }
      #logo-container { width: 95%; height: 55%; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
      #logo-container svg { width: 100%; height: 100%; overflow: visible; }
      #logo-container svg path { fill: #ffcc00 !important; filter: drop-shadow(0 0 2px #ff9900); }
      .logo-idle { animation: logoFloat 4s infinite alternate ease-in-out; }
      
      #status-container { width: 85%; height: 90px; margin-bottom: 15px; background-color: #000; border: 4px solid #444; outline: 2px solid #222; border-radius: 4px; box-shadow: inset 0 0 20px #000, 0 5px 10px rgba(0,0,0,0.5); background-image: radial-gradient(rgba(0, 150, 0, 0.3) 20%, transparent 25%); background-size: 4px 4px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
      #status-text { font-family: 'Jersey 15', sans-serif; font-size: 5rem; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; margin: 0; padding: 0; line-height: 1; margin-top: 5px; color: #33ff00; text-shadow: 0 0 8px #33ff00; position: relative; }
      .scroll-active { position: absolute; left: 100%; animation: marquee 3.5s linear infinite; }
      @keyframes marquee { 0% { left: 100%; transform: translateX(0%); } 100% { left: 0%; transform: translateX(-100%); } }
      .status-idle { color: #33ff00; text-shadow: 0 0 8px #33ff00; }
      .status-spin { color: #ccffcc; text-shadow: 0 0 15px #33ff00; }
      .status-tension { color: #ff3300; text-shadow: 0 0 15px #ff3300; } 
      
      .controls { display: flex; gap: 15px; justify-content: center; align-items: flex-start; width: 100%; margin-top: 5px; min-height: 80px; }
      button { font-family: 'Bowlby One SC', cursive; font-size: 1.5rem; padding: 10px 30px; border: 4px solid rgba(0,0,0,0.2); border-radius: 50px; cursor: pointer; text-transform: uppercase; transition: transform 0.1s; }
      button:active { transform: translateY(4px); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #spinBtn { background: #00cc00; color: white; box-shadow: 0 5px #006600; }
      #stopBtn { background: #ff0000; color: white; box-shadow: 0 5px #990000; display: none; }
      
      #winner-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #ffff00 0%, #ffcc00 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; opacity: 0; pointer-events: none; transform: scale(0.8); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); padding: 10px; box-sizing: border-box; }
      #winner-stage.pop-up-active { opacity: 1; pointer-events: all; transform: scale(1); }
      .winner-title-small { font-family: 'Bowlby One SC', cursive; font-size: 2.5vw; color: #000; margin-bottom: 2px; flex-shrink: 0; line-height: 1; }
      #winner-name-container { width: 95%; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; flex-shrink: 0; min-height: 45px; }
      #winner-name-big { font-family: 'Bowlby One SC', cursive; font-size: 4vw; line-height: 1; color: #000; text-transform: uppercase; margin: 0; text-shadow: 2px 2px 0 #fff; white-space: nowrap; }
      
      #winner-actions { display: none; flex-direction: column; gap: 6px; width: 95%; z-index: 20; }
      .control-row { display: flex; align-items: center; justify-content: space-between; gap: 5px; background: rgba(0,0,0,0.1); padding: 4px 10px; border-radius: 8px; border: 2px solid rgba(0,0,0,0.1); }
      .control-label { font-size: 1.2em; font-weight: bold; color: #000; width: 70px; text-align: left; font-family: 'Oswald', sans-serif; }
      .input-wrapper { position: relative; display: inline-block; }
      .currency-symbol { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 1.4em; color: #000; font-family: 'Oswald'; font-weight: bold; pointer-events: none; }
      .control-input { font-size: 1.4em; width: 70px; text-align: center; border: 3px solid #000; border-radius: 8px; padding: 2px; font-family: 'Oswald'; background: #fff; color: #000; padding-left: 20px; font-weight: bold; }
      .text-input { font-size: 1.1em; width: 130px; text-align: left; padding: 4px; border: 3px solid #000; border-radius: 8px; font-family: 'Oswald'; color: #000; font-weight: bold;}
      .control-btn { font-family: 'Oswald'; font-size: 1.1em; padding: 6px 10px; color: white; border: 2px solid #fff; border-radius: 20px; cursor: pointer; letter-spacing: 1px; width: 120px; transition: transform 0.1s; box-shadow: 0 4px rgba(0,0,0,0.3); text-transform: uppercase; font-weight: bold; }
      .control-btn:active { transform: translateY(2px); box-shadow: 0 2px rgba(0,0,0,0.3); }
      .btn-cash { background: linear-gradient(to bottom, #2ecc71, #27ae60); }
      .btn-pint { background: linear-gradient(to bottom, #e67e22, #d35400); }
      .btn-custom { background: linear-gradient(to bottom, #9c27b0, #7b1fa2); }
      .btn-absent { background: #333; color: #ccc; border: 2px solid #555; font-size: 1rem; width: 100%; margin-top: 2px; padding: 8px; border-radius: 8px; font-family: 'Oswald', sans-serif; cursor: pointer; font-weight: bold;}
      .btn-absent:hover { background: #000; color: #fff; }
      .btn-reset { background: transparent; border: none; color: #000; text-decoration: underline; font-size: 0.9rem; box-shadow: none; margin-top: 2px; cursor: pointer; font-weight: bold; }
      
      .grid-box { background: linear-gradient(to bottom, #222, #000); border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'New Amsterdam', sans-serif; font-size: 1.4rem; letter-spacing: 0.5px; color: #fff; line-height: 1.1; text-shadow: 0 0 5px #fff; padding: 5px; word-wrap: break-word; border: 4px dashed #775500; box-shadow: inset 0 0 10px #000; transition: opacity 0.5s; }
      .active { color: black !important; border: 4px dashed #ff0000 !important; box-shadow: 0 0 20px white !important; transform: scale(1.05); z-index: 10; font-weight: bold; animation: selectFlash 0.15s infinite alternate; }
      @keyframes selectFlash { from { background-color: #ffffff; } to { background-color: #ffff00; } }
      .winner-mode { background: #ffcc00 !important; color: #000 !important; border: 4px solid white !important; box-shadow: 0 0 50px #ffcc00 !important; animation: blink 0.5s infinite; }
      @keyframes blink { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
      
      .btn-report { position: fixed; bottom: 20px; right: 20px; background: linear-gradient(to bottom, #FFD700, #FFA000); border: 2px solid #fff; color: #3e2723; font-family: 'Oswald', sans-serif; font-size: 0.9em; padding: 10px 20px; cursor: pointer; border-radius: 30px; box-shadow: 0 4px #b71c1c, 0 5px 10px rgba(0,0,0,0.3); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; transition: all 0.1s; z-index: 50; }
      
      #global-dimmer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(5px); z-index: 100; }
      .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 120; flex-direction: column; align-items: center; justify-content: center; }
      .report-box { position: relative; z-index: 110; background: linear-gradient(135deg, #b71c1c, #8a0e0e); border: 4px solid #ffd700; width: 650px; padding: 40px; border-radius: 15px; color: #fff; box-shadow: 0 0 60px #000; text-align: left; }
      .report-title { margin-top:0; color: #ffd700; text-align:center; text-transform:uppercase; letter-spacing:3px; border-bottom: 2px solid #b8860b; padding-bottom: 15px; margin-bottom: 20px; text-shadow: 2px 2px 0 #000; }
      .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 1.4em; border-bottom: 1px solid rgba(0,0,0,0.3); padding: 10px 0; text-transform: uppercase; letter-spacing: 1px; font-family: 'Oswald', sans-serif;}
      .stat-label { color: #ffccbc; } .stat-val { color: #fff; font-weight: bold; text-shadow: 1px 1px 0 rgba(0,0,0,0.5); }
      .row-carry { border: 2px solid #ffd700; background: rgba(0,0,0,0.3); margin-top: 15px; padding: 15px; border-radius: 10px; font-size: 2.2em; }
      .row-carry .stat-label { color: #fff; } .row-carry .stat-val { color: #69f0ae; text-shadow: 0 0 10px rgba(105, 240, 174, 0.4); }
      .winner-list-label { margin-top: 25px; color: #ffd700; font-size: 1em; text-transform: uppercase; letter-spacing: 2px; font-family: 'Oswald', sans-serif;}
      .winner-list { max-height: 150px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; margin-top: 5px; border: 1px solid rgba(255,215,0,0.3); }
      .winner-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 1.2em; font-family: 'Oswald', sans-serif;}
      .report-actions { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
      .btn-archive { background: #4caf50; border: 2px solid #fff; color: white; padding: 10px 30px; border-radius: 30px; cursor: pointer; font-family: 'Oswald'; font-size: 1.2em; text-transform: uppercase; letter-spacing: 1px; }

      #toast-container { visibility: hidden; min-width: 280px; margin-left: -140px; background-color: #222; color: #fff; text-align: center; border-radius: 50px; padding: 16px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; font-size: 1.3rem; box-shadow: 0 5px 20px rgba(0,0,0,0.6); border: 2px solid #ffd700; opacity: 0; transition: opacity 0.5s, bottom 0.5s; font-family: 'Oswald', sans-serif; display: flex; align-items: center; justify-content: center; gap: 15px; }
      #toast-container.show { visibility: visible; opacity: 1; bottom: 50px; }

      #hydration-break-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at 15% 25%, rgba(255,255,255,0.2) 0%, transparent 15%), radial-gradient(circle at 75% 65%, rgba(255,255,255,0.15) 0%, transparent 20%), linear-gradient(135deg, #00d2ff, #0371a3); z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease-in-out; }
      #hydration-break-overlay.active { opacity: 1; pointer-events: auto; }
      .hydration-text { font-family: 'Oswald', sans-serif; font-size: 7.5vw; font-weight: 900; font-style: italic; color: #ffffff; text-transform: uppercase; line-height: 1; margin: 0; text-shadow: 6px 6px 15px rgba(0, 0, 0, 0.4); transform: skewX(-6deg) scale(0.8); transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      #hydration-break-overlay.active .hydration-text { transform: skewX(-6deg) scale(1); }

      @media screen and (max-height: 950px) { #scaler { transform: scale(0.85); } }
      @media screen and (max-height: 750px) { #scaler { transform: scale(0.70); } }
      @media screen and (max-height: 800px) { #winner-stage { padding: 10px; } .winner-title-small { font-size: 1.5vw; } #winner-name-big { font-size: 3.5vw; } #winner-actions { transform: scale(0.9); transform-origin: top center; margin-top: 0; } }
    </style>
  </head>
  <body class="intro-mode">

    <!-- 🔥 VIBRANT ARCADE TV INTRO GATE -->
    <div id="tv-intro-gate">
      <div class="gate-content">
        <h1 class="gate-title">MEMBERS DRAW</h1>
        <div class="gate-input-box">
            <input type="password" id="gate-pin-input" class="gate-input" placeholder="****" maxlength="4" autocomplete="off" onkeypress="if(event.key==='Enter') verifyGatePin()">
            <button id="gate-btn" class="gate-btn" onclick="verifyGatePin()">START SHOW</button>
        </div>
      </div>
    </div>

    <!-- 🔥 HARDCODED URLS -->
    <div class="game-selector">
      <a href="MembersDraw.html" class="game-link active">MEMBERS DRAW</a>
      <a href="https://cornerstonecoopapps.github.io/FridayClub/" class="game-link">FRIDAY CLUB</a>
      <a href="https://script.google.com/macros/s/AKfycbzvDrkgRVBb-x6M6PfbJT6wpJG6sOoVuFyB3OKrHU0qFYh47fU1p__JVP6h2deRpR1w/exec" class="game-link">MAKE YOUR MARK</a>
    </div>

   <div class="draw-mode-wrapper">
      <button class="mode-btn active" id="btn-mode-all" onclick="setDrawMode('ALL')">ALL MEMBERS</button>
      <button class="mode-btn" id="btn-mode-top100" onclick="setDrawMode('TOP100')">TOP 100</button>
      <button class="mode-btn" id="btn-mode-top50" onclick="setDrawMode('TOP50')">TOP 50</button>
      <button class="mode-btn" style="border-left: 2px solid #ffd700; margin-left: 4px; border-radius: 4px 12px 12px 4px;" id="btn-mode-today" onclick="setDrawMode('TODAY')">🔥 ACTIVE TODAY</button>
    </div>

    <!-- 🔥 ROLLOVER POT RESTORED -->
    <div id="rollover-box">
      <div class="rollover-title">ROLLOVER POT</div>

      <div class="rollover-controls">
        <button onclick="changePot(-25)">-</button><button onclick="changePot(25)">+</button>
      </div>
    </div>
    
    <div id="scaler">
      <div id="game-container">
        <div id="center-stage">

    <script>
      if (!Array.prototype.at) { Array.prototype.at = function(n) { n = Math.trunc(n) || 0; if (n < 0) n += this.length; if (n < 0 || n >= this.length) return undefined; return this.slice(n, n + 1).pop(); }; }
      if (!String.prototype.at) { String.prototype.at = function(n) { n = Math.trunc(n) || 0; if (n < 0) n += this.length; if (n < 0 || n >= this.length) return undefined; return this.substring(n, n + 1); }; }

      // ==========================================
      // 🔗 API BRIDGE (NO SECRETS EXPOSED!)
      // ==========================================
      const API_URL = "https://script.google.com/a/gateinnwinsford.com/macros/s/AKfycbwX84Y6p9mRo2SUeUOrBaiFjqaI_yQ26K2kE5wO0bofcEYUlOXEnZF7q_RZTYu0Yynb/exec";
      const FB_BASE_URL = "https://friday-club-ticker-default-rtdb.europe-west1.firebasedatabase.app/";

      let projectorSessionPin = null;
      let sessionToken = null; 

      // 🔥 AUDIO SYNC ENGINE FOR MEMBERS DRAW
      const audioMap = {
          'drumroll': new Audio('https://cdn.pixabay.com/audio/2022/03/15/audio_18d09bdeaf.mp3'),
          'sad': new Audio('https://www.myinstants.com/media/sounds/sad-trombone-gaming-sound-effect-hd.mp3'),

          'buzzer': new Audio('https://www.myinstants.com/media/sounds/family-feud-wrong-answer-buzzer.mp3'),
          'rewind': new Audio('https://www.myinstants.com/media/sounds/dj-record-rewind-sound-effect.mp3')
      };

      function playSoundFX(type) { if (audioMap[type]) { audioMap[type].currentTime = 0; audioMap[type].play().catch(e => console.log("Audio blocked.")); } }

      // 🔥 DELAYED AUDIO SYNC TO PREVENT BOOT FREEZE
      function syncCustomAudio() {
          fetch(FB_BASE_URL + "customAudioData.json")
          .then(res => res.json())
          .then(data => {
              if (data) {
                  Object.keys(data).forEach(key => {
                      if (!audioMap[key] && data[key].data) {
                          audioMap[key] = new Audio(data[key].data);
                      }
                  });
              }
          }).catch(e => console.log("No custom audio found."));
      }

      // 🛡️ THE WRITER: Uses Instant VIP Speed if it has a token, otherwise uses the proxy
      function proxyFirebaseWrite(path, method, payload) {
          if (!projectorSessionPin) return; 
          
          if (!sessionToken) sessionToken = sessionStorage.getItem('sessionToken');
          
          if (sessionToken) {
              let options = { method: method, headers: { 'Content-Type': 'application/json' } };
              if (payload !== undefined) options.body = JSON.stringify(payload);
              fetch(FB_BASE_URL + path + "?auth=" + sessionToken, options);
              return;
          }

          let body = { action: 'secureFirebaseWrite', pin: projectorSessionPin, path: path, method: method };
          if (payload !== undefined) body.payload = payload;
          fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
      }

      const google = {
        script: {
          run: {
            withSuccessHandler: function(onSuccess) { this._onSuccess = onSuccess; return this; },
            withFailureHandler: function(onFailure) { this._onFailure = onFailure; return this; },
            _callApi: function(action, params) {
              let url = API_URL + "?action=" + action;
              if (params) { for (let key in params) url += "&" + key + "=" + encodeURIComponent(params[key]); }
              let successCb = this._onSuccess; let failureCb = this._onFailure;
              
              fetch(url).then(res => res.json()).then(data => {
                  if (data.error && failureCb) failureCb(data.error);
                  else if (successCb) {
                      if (data.result !== undefined) successCb(data.result);
                      else successCb(data);
                  }
              }).catch(err => { if (failureCb) failureCb(err); });
              this._onSuccess = null; this._onFailure = null;
            },
            getFridayNames: function() { this._callApi('getFridayNames'); },
            getNamesFromSheet: function() { this._callApi('getNamesFromSheet'); },
            getTodayActivePlayers: function() { this._callApi('getTodayActive'); }, 
            getReportData: function() { this._callApi('getReportData'); },
            updateRolloverPot: function(amount) { this._callApi('updatePot', {amount: amount}); },
            getRolloverPot: function() { this._callApi('getPot'); },
            processFridayPrize: function(name, id, type, amount, pin) { this._callApi('processPrize', {name: name, id: (id||''), type: type, amount: amount, pin: (pin||'')}); },
            processAbsentPlayer: function(name, id) { this._callApi('processAbsent', {name: name, id: (id||'')}); },
            webApplyCorrection: function(rowNum, cid, oldCredit, newType, newAmount) { this._callApi('applyCorrection', {rowNum: rowNum, cid: cid, oldCredit: oldCredit, newType: newType, newAmount: newAmount}); },
            webRecoverTickets: function() { this._callApi('recoverTickets'); },
            getTodayWinnersForRemote: function() { this._callApi('requestWinners'); }
          }
        }
      };

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var drawMode = 'ALL'; 

      // ==========================================
      // 🔐 TV INTRO GATE VERIFICATION
      // ==========================================
      function verifyGatePin() {
          let pin = document.getElementById('gate-pin-input').value;
          if (!pin) return;
          let btn = document.getElementById('gate-btn');
          btn.innerText = "VERIFYING...";
          
          fetch(API_URL + "?action=verifyPin&pin=" + pin)
          .then(r => r.json())
          .then(res => {
              if (res.success) {
                  sessionStorage.setItem('hostPin', pin);
                  sessionStorage.setItem('hostName', res.name);
                  sessionStorage.setItem('sessionToken', res.token); 
                  unlockProjectorGate(pin, res.name);
              } else {
                  btn.innerText = "ACCESS DENIED";
                  btn.classList.add('denied');
                  setTimeout(() => { btn.innerText = "START SHOW"; btn.classList.remove('denied'); }, 2000);
                  document.getElementById('gate-pin-input').value = "";
              }
          }).catch(err => { btn.innerText = "START SHOW"; });
      }

      function unlockProjectorGate(pin, name) {
          projectorSessionPin = pin;
          sessionToken = sessionStorage.getItem('sessionToken');
          let gate = document.getElementById('tv-intro-gate');
          if(gate) {
              gate.classList.add('unlocked');
              setTimeout(() => gate.style.display = 'none', 1500);
          }
          showToast("WELCOME, " + (name || "HOST").toUpperCase(), true);
          playWinSound();
      }

      function setDrawMode(mode) {
          drawMode = mode;
          document.getElementById('btn-mode-all').classList.toggle('active', mode === 'ALL');
          document.getElementById('btn-mode-top100').classList.toggle('active', mode === 'TOP100');
          document.getElementById('btn-mode-top50').classList.toggle('active', mode === 'TOP50');
          document.getElementById('btn-mode-today').classList.toggle('active', mode === 'TODAY');
          
          if (mode === 'TODAY') {
              showToast("Fetching today's active players from till...", true);
              updateStatus("FETCHING TILL...", "status-spin", false); document.getElementById('spinBtn').disabled = true;
              
              google.script.run.withSuccessHandler(function(todayData) {
                  allNames = todayData; 
                  showToast(`Loaded ${todayData.length} players from today!`, true); 
                  startIdleMode(false);
              }).getTodayActivePlayers();
              return;
          }
          allNames = masterMembersList;
          if (mode === 'TOP50') showToast("Elite Mode: Top 50 Spenders", true);
          else if (mode === 'TOP100') showToast("VIP Mode: Top 100 Spenders", true);
          else showToast("All Active Members", true);
          startIdleMode(false);
      }

      let currentPot = 25;
      function loadPot() { 
          google.script.run.withSuccessHandler(function(potVal) {
              // 🔥 FIX: Now safely handles it if Apps Script returns an integer OR an object
              if (potVal !== null && typeof potVal === 'object' && potVal.pot !== undefined) {
                  currentPot = potVal.pot;
              } else if (!isNaN(Number(potVal)) && potVal !== null && potVal !== "") {
                  currentPot = Number(potVal);
              } else {
                  currentPot = 25;
              }
              document.getElementById('rollover-amount').innerText = '£' + currentPot; 
          }).getRolloverPot(); 
      }

      function changePot(changeAmount) { 
          currentPot = parseInt(currentPot) + parseInt(changeAmount); 
          if (currentPot < 0) currentPot = 0; 
          document.getElementById('rollover-amount').innerText = '£' + currentPot; 
          google.script.run.updateRolloverPot(currentPot); 
      }
      
      let spinMusic = new Audio('https://incompetech.com/music/royalty-free/mp3-royaltyfree/Welcome%20to%20the%20Show.mp3'); spinMusic.loop = true; spinMusic.volume = 0.3; 
      function playTone(freq, type, duration, vol) { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime); gain.gain.setValueAtTime(vol || 0.05, audioCtx.currentTime); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration); osc.stop(audioCtx.currentTime + duration); }
      function playThud() { playTone(150, 'square', 0.2, 0.1); } function playBlip() { playTone(800, 'square', 0.1, 0.05); } function playWinSound() { let now = audioCtx.currentTime; [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => { setTimeout(() => playTone(freq, 'triangle', 0.4, 0.1), i * 100); }); }

      var allNames = []; var spinInterval; var refreshInterval; var idleInterval; var activeIndex = -1; var totalBoxes = 18; var dataLoaded = false;
      var gameState = "LOADING"; let masterMembersList = []; 

      // 🔥 FIREBASE REMOTE ENGINE
      let remoteListenerActive = true; let remoteTimer = null; let lastCommandTime = Date.now();

      document.addEventListener('keydown', function(event) { 
          var target = event.target || event.srcElement; if (target.tagName.toUpperCase() === 'INPUT') return;
          
          if (event.key === 'H' || event.key === 'h') { document.getElementById('hydration-break-overlay').classList.toggle('active'); return; }
          
          if (event.code === 'Space' || event.code === 'Enter') { 
              let gate = document.getElementById('tv-intro-gate');
              if(!gate || gate.style.display === 'none') {
                  event.preventDefault(); 
                  if (gameState === "IDLE") startSpin(); else if (gameState === "SPINNING") stopSpin(); 
              }
          }
      });

      window.onload = function() {
         loadPot(); 
         initBoardStructure(); 
         updateStatus("FETCHING CLOUD DATA...", "status-spin", false);
         setTimeout(() => { document.body.classList.remove('intro-mode'); }, 500);
         
         let savedPin = sessionStorage.getItem('hostPin');
         let savedName = sessionStorage.getItem('hostName');
         let savedToken = sessionStorage.getItem('sessionToken'); 
         
         if (savedPin && savedToken) {
             projectorSessionPin = savedPin;
             sessionToken = savedToken; 
             let gate = document.getElementById('tv-intro-gate');
             if (gate) gate.style.display = 'none'; 
         }

         // 🔥 DELAYED AUDIO FETCH (No Boot Freezes!)
         setTimeout(syncCustomAudio, 2500); 

         google.script.run.withSuccessHandler(function(data) { 
             masterMembersList = data; 
             allNames = data; 
             dataLoaded = true;
             startIdleMode(true); 
         }).getNamesFromSheet();
         
         startRemoteListener();
      };

      function startRemoteListener() {
          if (remoteTimer) clearInterval(remoteTimer);
          remoteTimer = setInterval(() => {
              fetch(FB_BASE_URL + "remoteCommand.json")
              .then(res => res.json())
              .then(cmd => {
                  if (!cmd) return;
                  if (cmd.timestamp > lastCommandTime) {
                      lastCommandTime = cmd.timestamp;
                      
                      // 🔥 MAGIC FIX: Catch the VIP Token from the remote!
                      if (cmd.token && sessionToken !== cmd.token) {
                          sessionToken = cmd.token;
                          sessionStorage.setItem('sessionToken', sessionToken);
                      }

                      let gate = document.getElementById('tv-intro-gate');
                      if (gate && gate.style.display !== 'none' && !gate.classList.contains('unlocked')) {
                          sessionStorage.setItem('hostPin', cmd.pin);
                          unlockProjectorGate(cmd.pin, "HOST");
                      }

                      if (cmd.type === 'sound') playSoundFX(cmd.action); 
                      else if (cmd.type === 'members') { if (cmd.action === 'startSpin') startSpin(); else if (cmd.action === 'stopSpin') stopSpin(); else if (cmd.action.startsWith('tier|')) setDrawMode(cmd.action.split('|')[1]); }
                      else if (cmd.type === 'stage') {
                          if (cmd.action === 'navMembers') window.top.location.href = "MembersDraw.html";
                          if (cmd.action === 'navFriday') window.top.location.href = "https://cornerstonecoopapps.github.io/FridayClub/";
                          if (cmd.action === 'resetWheel') startIdleMode(); 
                          if (cmd.action === 'refreshAudio') syncCustomAudio(); 
                      }
                      else if (cmd.type === 'wheel') {
                          if (cmd.action === 'award') {
                              document.getElementById('winner-stage').classList.remove('pop-up-active');
                              document.getElementById('cashInput').value = cmd.cash || ""; 
                              document.getElementById('pintInput').value = cmd.pint || "1"; 
                              document.getElementById('customInput').value = cmd.custom || "";
                              sendPrize(cmd.prizeType, cmd.pin); 
                          }
                          else if (cmd.action === 'absent') {
                              document.getElementById('winner-stage').classList.remove('pop-up-active');
                              startIdleMode(); 
                          }
                      }
                      // 🔥 NEW: Add Admin listener so the projector fetches the undo list!
                      else if (cmd.type === 'admin') {
                          if (cmd.action === 'requestWinners') {
                              google.script.run.withSuccessHandler(data => {
                                  proxyFirebaseWrite("admin/winners.json", 'PUT', data);
                              }).getTodayWinnersForRemote();
                          }
                      }
                  }
              }).catch(e => console.log("Remote Link Active"));
          }, 500); // ⚡ Increased polling speed
      }

      function initBoardStructure() {
        var container = document.getElementById('game-container'); if(document.querySelectorAll('.grid-box').length > 0) return;
        var coordinates = [{r:1, c:1}, {r:1, c:2}, {r:1, c:3}, {r:1, c:4}, {r:1, c:5}, {r:1, c:6}, {r:2, c:6}, {r:3, c:6}, {r:4, c:6}, {r:5, c:6}, {r:5, c:5}, {r:5, c:4}, {r:5, c:3}, {r:5, c:2}, {r:5, c:1}, {r:4, c:1}, {r:3, c:1}, {r:2, c:1}];
        for (var i = 0; i < totalBoxes; i++) { var div = document.createElement('div'); div.className = 'grid-box'; div.id = 'box-' + i; var coords = coordinates.at(i); div.style.gridRow = coords.r; div.style.gridColumn = coords.c; div.innerText = "---"; var randomBg = ["#000044", "#440000", "#444400"].at(i % 3); div.style.background = randomBg; container.appendChild(div); }
      }
      
      function updateStatus(text, stateClass, shouldScroll) {
         var el = document.getElementById('status-text'); var container = document.getElementById('status-container'); el.innerText = text; el.className = ''; if(stateClass) el.classList.add(stateClass);
         if (shouldScroll) { container.classList.add('scroll-container-active'); el.classList.add('scroll-active'); } else { container.classList.remove('scroll-container-active'); el.classList.remove('scroll-active'); el.style.left = "auto"; el.style.transform = "none"; }
         container.style.opacity = 1;
      }
      
      function startIdleMode(skipBuild) {
        if(!skipBuild) initBoardStructure(); clearInterval(spinInterval); clearInterval(refreshInterval); clearInterval(idleInterval);
        activeIndex = -1; gameState = "IDLE";
        document.getElementById('winner-stage').classList.remove('pop-up-active'); document.getElementById('normal-stage-content').style.opacity = 1; 
        
        document.getElementById('winner-actions').style.display = 'none';
        
        var oldWinner = document.querySelector('.winner-mode'); if(oldWinner) oldWinner.classList.remove('winner-mode'); Array.prototype.slice.call(document.querySelectorAll('.active')).forEach(function(el) { el.classList.remove('active'); });
        var logo = document.getElementById('logo-container'); logo.style.opacity = 1; logo.style.transform = "scale(1)"; logo.classList.add('logo-idle'); 
        updateStatus("MEMBERS DRAW", "status-idle", false);
        document.getElementById('spinBtn').disabled = false; document.getElementById('spinBtn').style.display = 'block'; document.getElementById('stopBtn').style.display = 'none'; 

        proxyFirebaseWrite("boxes/activeWinner.json", 'DELETE');
        
        idleTick(); idleInterval = setInterval(idleTick, 1500); 
      }
      
      function idleTick() { moveLight(false); refreshBoardNames(); }
      
      function getRandomName() { 
        var pool = allNames; if (drawMode === 'TOP100') pool = allNames.filter(p => p.rank <= 100); else if (drawMode === 'TOP50') pool = allNames.filter(p => p.rank <= 50);
        if (pool.length === 0) return "---"; return (pool.at(Math.floor(Math.random() * pool.length)).name || "---").toUpperCase(); 
      }
      
      function startSpin() {
        if (gameState !== "IDLE") return; gameState = "SPINNING";
        clearInterval(idleInterval); clearInterval(spinInterval); clearInterval(refreshInterval);
        if(audioCtx.state === 'suspended') audioCtx.resume(); spinMusic.currentTime = 0; spinMusic.play();
        var logo = document.getElementById('logo-container'); logo.classList.remove('logo-idle'); 
        document.getElementById('spinBtn').style.display = 'none'; document.getElementById('stopBtn').style.display = 'block';
        updateStatus("GOOD LUCK!", "status-spin", false);
        spinInterval = setInterval(function() { moveLight(true); }, 80); refreshInterval = setInterval(function() { refreshBoardNames(); }, 200); 
      }
      
      function moveLight(playSound) {
        Array.prototype.slice.call(document.querySelectorAll('.active')).forEach(function(el) { el.classList.remove('active'); });
        var nextIndex; do { nextIndex = Math.floor(Math.random() * totalBoxes); } while (nextIndex === activeIndex);
        activeIndex = nextIndex; document.getElementById('box-' + activeIndex).classList.add('active'); if(playSound) playBlip();
      }
      
      function refreshBoardNames() { for(var i = 0; i < totalBoxes; i++) document.getElementById('box-' + i).innerText = getRandomName(); }
      
      function stopSpin() { 
        if (gameState !== "SPINNING") return; gameState = "STOPPING"; clearInterval(spinInterval); clearInterval(refreshInterval); 
        document.getElementById('stopBtn').style.display = 'none'; updateStatus("THIS WEEKS WINNER IS...          ", "status-tension", true); slowDown(8, 100); 
      }
      
      function slowDown(jumpsLeft, delay) { if (jumpsLeft <= 0) { declareWinner(); return; } setTimeout(function() { moveLight(true); slowDown(jumpsLeft - 1, delay + 80); }, delay); }
      
      function fitTextToContainer(elementId, maxVw) { var el = document.getElementById(elementId); var container = document.getElementById('winner-name-container'); var currentVw = maxVw; var minVw = 1.5; el.style.fontSize = currentVw + "vw"; while (el.offsetWidth > container.offsetWidth && currentVw > minVw) { currentVw -= 0.2; el.style.fontSize = currentVw + "vw"; } }
      
      function declareWinner() {
        if (gameState !== "STOPPING") return; gameState = "WINNER"; spinMusic.pause(); playWinSound(); 
        var winningBox = document.getElementById('box-' + activeIndex); winningBox.classList.remove('active'); winningBox.classList.add('winner-mode');
        var winnerName = winningBox.innerText; document.getElementById('normal-stage-content').style.opacity = 0; document.getElementById('winner-name-big').innerText = winnerName; document.getElementById('winner-stage').classList.add('pop-up-active');
        
        document.getElementById('winner-actions').style.display = 'flex';
        document.getElementById('cashInput').value = currentPot;
        
        proxyFirebaseWrite("boxes/activeWinner.json", 'PUT', winnerName);
        
        setTimeout(function() { fitTextToContainer('winner-name-big', 5); }, 50);
      }

      function showToast(msg, isSuccess) {
          var x = document.getElementById("toast-container"); x.innerHTML = `<span class="toast-icon">${isSuccess ? "✅" : "⚠️"}</span> <span>${msg}</span>`; x.className = "show"; x.style.borderColor = isSuccess ? "#00e676" : "#ff1744";
          if(audioCtx && audioCtx.state !== 'suspended') { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(isSuccess ? 880 : 220, audioCtx.currentTime); if(isSuccess) { osc.frequency.setValueAtTime(880, audioCtx.currentTime); osc.frequency.setValueAtTime(1108, audioCtx.currentTime + 0.1); osc.frequency.setValueAtTime(1318, audioCtx.currentTime + 0.2); } gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.6); }
          setTimeout(function(){ x.className = x.className.replace("show", ""); }, 4000);
      }

      // 🔥 THE FIX: Now perfectly accepts MEMBERS_CASH without wiping the player ID!
      function sendPrize(type, pinOverride) { 
        let activePin = pinOverride;
        
        if (!activePin) {
            if (!projectorSessionPin) {
                projectorSessionPin = prompt("🔒 SECURE SESSION: Enter Staff PIN once to unlock the till for this game:");
                if (!projectorSessionPin) return; 
            }
            activePin = projectorSessionPin;
        }
        
        var winnerName = document.getElementById("winner-name-big").innerText; 
        var amount = 0; 
        var activeBtn = document.getElementById((type === 'CASH' || type === 'MEMBERS_CASH' || type === 'PHYSICAL_CASH') ? 'btnCash' : (type === 'PINT' ? 'btnPint' : 'btnCustom'));
        
        if (type === 'CASH' || type === 'MEMBERS_CASH' || type === 'PHYSICAL_CASH') { 
            amount = document.getElementById("cashInput").value; 
            if(amount === "" || amount <= 0) { alert("Enter Cash Amount!"); return; } 
            
            // 🔥 ONLY resets pot if physical/member cash is entered!
            currentPot = 25; document.getElementById('rollover-amount').innerText = '£' + currentPot; 
            google.script.run.updateRolloverPot(currentPot);
        } 
        else if (type === 'PINT') { 
            amount = document.getElementById("pintInput").value; 
            if(amount === "" || amount <= 0) { alert("Enter Number of Pints!"); return; } 
        } 
        else if (type === 'CUSTOM') { 
            amount = document.getElementById("customInput").value; 
            if(amount === "") { alert("Enter Prize Name!"); return; } 
        } 
        
        document.querySelectorAll('.control-btn, .action-btn').forEach(b => { b.setAttribute('data-txt', b.innerText); b.disabled = true; b.innerText = "..."; });
        
        var playerId = 0; 
        
        // 🔥 FIX: allNames array comes straight from Google Sheet, guaranteed to have IDs!
        if (allNames && allNames.length > 0) {
            let winnerObj = allNames.find(function(p) { return p.name.toUpperCase().replace(/\s/g,'') === winnerName.replace(/\s/g,''); });
            if (winnerObj && winnerObj.id) playerId = winnerObj.id;
        }
        
        // Ensure we don't blind-log a 0 to Epos Now
        if (!playerId) {
            showToast("Could not locate Customer ID for " + winnerName, false);
            document.querySelectorAll('.control-btn, .action-btn').forEach(b => { b.disabled = false; b.innerText = b.getAttribute('data-txt') || b.innerText; });
            return;
        }
        
        let displayPrizeText = (type === 'CASH' || type === 'MEMBERS_CASH' || type === 'PHYSICAL_CASH') ? `£${amount} Cash` : (type === 'PINT' ? `${amount} Pint(s)` : amount);
        
        google.script.run.withSuccessHandler(function(res) { 
          if (res.includes("UNAUTHORIZED")) {
              showToast(res, false);
              projectorSessionPin = null; 
              document.querySelectorAll('.control-btn, .action-btn').forEach(b => { b.disabled = false; b.innerText = b.getAttribute('data-txt'); }); 
              return;
          }

          showToast(res, true); 
          if(res.includes("SUCCESS") || res.includes("Logged")) { 
              setTimeout(startIdleMode, 2000); 
          } else { 
              document.querySelectorAll('.control-btn, .action-btn').forEach(b => { b.disabled = false; b.innerText = b.getAttribute('data-txt'); }); 
          }
        }).withFailureHandler(function(err) { showToast("Error: " + err, false); document.querySelectorAll('.control-btn, .action-btn').forEach(b => { b.disabled = false; b.innerText = b.getAttribute('data-txt'); }); })
        .processFridayPrize(winnerName, playerId, type, amount, activePin); 
      }
      
      function markAbsent() {
          var winnerName = document.getElementById('winner-name-big').innerText;
          var winnerObj = allNames.find(function(p) { return p.name.toUpperCase().replace(/\s/g,'') === winnerName.replace(/\s/g,''); });
          var btn = document.getElementById('btnAbsent'); btn.disabled = true; btn.innerText = "DRAFTING..."; 
          google.script.run.withSuccessHandler(function(draftRes) {
              showToast("Draft Created! Logging...", false);
              google.script.run.withSuccessHandler(function(res){ showToast("Marked Absent & Drafted", true); startIdleMode(); })
              .processFridayPrize(winnerName, (winnerObj ? winnerObj.id : 0), "ABSENT", "0");
          }).processAbsentPlayer(winnerName, (winnerObj ? winnerObj.id : ""));
      }

      function showReport() { document.getElementById('global-dimmer').style.display = 'block'; document.getElementById('report-overlay').style.display = 'flex'; const btn = document.getElementById('btn-archive'); btn.innerText = "ARCHIVE TO SHEET"; btn.disabled = false; btn.style.background = "#4caf50"; google.script.run.withSuccessHandler(function(rep) { document.getElementById('rep-entries').innerText = rep.entries || 0; document.getElementById('rep-pot').innerText = "£" + (rep.revenueTonight || 0).toFixed(2); document.getElementById('rep-late').innerText = "£" + (rep.revenueLate || 0).toFixed(2); document.getElementById('rep-payouts').innerText = "£" + (rep.cashWon || 0).toFixed(2); document.getElementById('rep-carry').innerText = "£" + (rep.carryOver || 0).toFixed(2); var listHTML = ""; if(rep.winners && rep.winners.length > 0) rep.winners.forEach(function(w) { listHTML += `<div class='winner-row'><span>${w.name}</span><span>${w.prize}</span></div>`; }); document.getElementById('rep-list').innerHTML = listHTML || "NO WINNERS YET."; }).getReportData(); }
      function archiveReport() { const btn = document.getElementById('btn-archive'); btn.innerText = "SAVED (Check Sheet)"; btn.disabled = true; }
      function closeReport() { document.getElementById('report-overlay').style.display='none'; document.getElementById('global-dimmer').style.display='none'; }
    </script>
  </body>
</html>
